[package]
authors = ["Davy Duperron <yamafaktory@gmail.com>"]
categories = ["data-structures", "mathematics", "science"]
description = "Hypergraph is data structure library to create a directed hypergraph in which an hyperedge can join any number of vertices."
edition = "2024"
exclude = [".github", "hypergraph.svg", "rustfmt.toml"]
keywords = ["data-structure", "graph", "hypergraph"]
license = "MIT"
name = "hypergraph"
readme = "README.md"
repository = "https://github.com/yamafaktory/hypergraph"
rust-version = "1.95"
version = "3.0.0"

[features]
serde = ["dep:serde", "indexmap/serde"]
persistence = ["serde", "dep:fjall", "dep:quick_cache", "dep:postcard"]

[dependencies]
ahash = "0.8.12"
postcard = { version = "1.1.3", features = ["alloc"], optional = true }
fjall = { version = "3.1.4", optional = true }
indexmap = { version = "2.14.0", features = ["rayon"] }
itertools = "0.14.0"
quick_cache = { version = "0.6.22", optional = true }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = "2.0.18"

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1.0.150"
tempfile = "3.27.0"

[[bench]]
name = "performance"
harness = false

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
nonstandard_style = { level = "deny", priority= -1 }
rust_2024_compatibility = { level = "forbid", priority= -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
unused_imports = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
